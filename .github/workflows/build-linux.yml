name: 'Build (linux)'

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      extra-conf-options:
        required: false
        type: string
      make-target:
        required: false
        type: string
        default: 'product-bundles test-bundles'
      debug-levels:
        required: false
        type: string
        default: '[ "release" ]'
      gcc-major-version:
        required: true
        type: string
      gcc-package-suffix:
        required: false
        type: string
        default: ''
      apt-architecture:
        required: false
        type: string
      apt-extra-packages:
        required: false
        type: string
      configure-arguments:
        required: false
        type: string
      make-arguments:
        required: false
        type: string

jobs:
  build-linux:
    name: build
    runs-on: ubuntu-22.04
    container:
      #image: debian:buster
      image: ubuntu:18.04
      # GitHub forces JavaScript actions onto Node 24, whose official builds
      # need glibc >= 2.28, but Ubuntu 18.04 has glibc 2.27.  So we mount
      # over the runner's Node 24 with an unofficial glibc 2.17 build of
      # Node 24, which we install in the first step below.
      volumes:
        - /node24-glibc217:/node24-glibc217:rw,rshared
        - /node24-glibc217:/__e/node24:ro,rshared
    env:
      NODE24_GLIBC217_VERSION: v24.22.2
      NODE24_GLIBC217_SHA256: 2644f0845671e149b8b0705a4fdcca2993995348618dc98c681ba0c7cdf604d2

    strategy:
      fail-fast: false
      #matrix:
      #  debug-level: ${{ fromJSON(inputs.debug-levels) }}
      #  include:
      #    - debug-level: debug
      #      flags: --with-debug-level=fastdebug
      #      suffix: -debug

    steps:
      - name: 'Install some dependencies'
        run: |
          apt-get update
          apt-get install -y build-essential git wget curl xz-utils sudo unzip zip openjdk-11-jdk autoconf libfreetype6-dev libcups2-dev libx11-dev libxext-dev libxrender-dev libxrandr-dev libxtst-dev libxt-dev libasound2-dev libffi-dev file binutils libfontconfig-dev
          # If we really need gcc-10, we can get it from this PPA:
          apt-get install -y software-properties-common
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test

      # This must come before any JavaScript actions (see container comment above)
      - name: 'Install Node 24 built for glibc 2.17'
        run: |
          tarball="node-${NODE24_GLIBC217_VERSION}-linux-x64-glibc-217.tar.xz"
          curl -fsSL -o "/tmp/$tarball" "https://unofficial-builds.nodejs.org/download/release/${NODE24_GLIBC217_VERSION}/$tarball"
          echo "${NODE24_GLIBC217_SHA256}  /tmp/$tarball" | sha256sum -c -
          tar -xJf "/tmp/$tarball" --strip-components 1 -C /node24-glibc217
          rm -f "/tmp/$tarball"
          /__e/node24/bin/node --version

      - name: 'Checkout the JDK source'
        uses: actions/checkout@v7

      - name: 'Get the BootJDK'
        id: bootjdk
        uses: ./.github/actions/get-bootjdk
        with:
          platform: linux-x64

      - name: 'Get JTReg'
        id: jtreg
        uses: ./.github/actions/get-jtreg

      - name: 'Get GTest'
        id: gtest
        uses: ./.github/actions/get-gtest

      - name: 'Set architecture'
        id: arch
        run: |
          # Set a proper suffix for packages if using a different architecture
          if [[ '${{ inputs.apt-architecture }}' != '' ]]; then
            echo 'suffix=:${{ inputs.apt-architecture }}' >> $GITHUB_OUTPUT
          fi

      # Upgrading apt to solve libc6 installation bugs, see JDK-8260460.
      - name: 'Install toolchain and dependencies'
        shell: bash
        run: |
          # Install dependencies using apt-get
          if [[ '${{ inputs.apt-architecture }}' != '' ]]; then
            sudo dpkg --add-architecture ${{ inputs.apt-architecture }}
          fi
          sudo apt-get update
          sudo apt-get install -f -y aptitude
          sudo apt-get install --only-upgrade apt
          sudo apt-get install -y gcc-${{ inputs.gcc-major-version }}${{ inputs.gcc-package-suffix }} g++-${{ inputs.gcc-major-version }}${{ inputs.gcc-package-suffix }} libxrandr-dev${{ steps.arch.outputs.suffix }} libxtst-dev${{ steps.arch.outputs.suffix }} libcups2-dev${{ steps.arch.outputs.suffix }} libasound2-dev${{ steps.arch.outputs.suffix }} ${{ inputs.apt-extra-packages }}
          #sudo apt-get install -y gcc-${{ inputs.gcc-major-version }}${{ inputs.gcc-package-suffix }}=${{ inputs.apt-gcc-version }} g++-${{ inputs.gcc-major-version }}${{ inputs.gcc-package-suffix }}=${{ inputs.apt-gcc-version }} libxrandr-dev${{ steps.arch.outputs.suffix }} libxtst-dev${{ steps.arch.outputs.suffix }} libcups2-dev${{ steps.arch.outputs.suffix }} libasound2-dev${{ steps.arch.outputs.suffix }} ${{ inputs.apt-extra-packages }}
          #sudo aptitude -y install gcc-10 g++-10 libxrandr-dev libxtst-dev libcups2-dev libcupsimage2-dev libasound2-dev ${{ inputs.apt-extra-packages }}
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-${{ inputs.gcc-major-version }} 100 --slave /usr/bin/g++ g++ /usr/bin/g++-${{ inputs.gcc-major-version }}

      - name: 'Configure'
        run: >
          bash configure
          --with-conf-name=${{ inputs.platform }}
          ${{ matrix.flags }}
          --with-version-pre=ts-jgss
          --with-version-opt=
          --with-boot-jdk=${{ steps.bootjdk.outputs.path }}
          --with-jtreg=${{ steps.jtreg.outputs.path }}
          --with-gtest=${{ steps.gtest.outputs.path }}
          --with-zlib=system
          --with-jmod-compress=zip-1
          ${{ inputs.extra-conf-options }} ${{ inputs.configure-arguments }} || (
          echo "Dumping config.log:" &&
          cat config.log &&
          exit 1)

      - name: 'Build'
        id: build
        uses: ./.github/actions/do-build
        with:
          make-target: '${{ inputs.make-target }} ${{ inputs.make-arguments }}'
          platform: ${{ inputs.platform }}
          debug-suffix: '${{ matrix.suffix }}'

      - name: 'Prep release bundles'
        id: bundles
        run: |
          # Rename bundles to consistent names
          jdk_bundle_zip="$(ls build/*/bundles/jdk-*_bin${{ inputs.debug-suffix }}.zip 2> /dev/null || true)"
          jdk_bundle_tar_gz="$(ls build/*/bundles/jdk-*_bin${{ inputs.debug-suffix }}.tar.gz 2> /dev/null || true)"
          symbols_bundle="$(ls build/*/bundles/jdk-*_bin${{ inputs.debug-suffix }}-symbols.tar.gz 2> /dev/null || true)"
          tests_bundle="$(ls build/*/bundles/jdk-*_bin-tests${{ inputs.debug-suffix }}.tar.gz 2> /dev/null || true)"

          mkdir release-bundles

          if [[ "$jdk_bundle_zip" != "" ]]; then
            cp "$jdk_bundle_zip" "release-bundles/jdk-${{ inputs.platform }}${{ inputs.debug-suffix }}.zip"
          fi
          if [[ "$jdk_bundle_tar_gz" != "" ]]; then
            cp "$jdk_bundle_tar_gz" "release-bundles/jdk-${{ inputs.platform }}${{ inputs.debug-suffix }}.tar.gz"
          fi
          if [[ "$symbols_bundle" != "" ]]; then
            cp "$symbols_bundle" "release-bundles/symbols-${{ inputs.platform }}${{ inputs.debug-suffix }}.tar.gz"
          fi
          if [[ "$tests_bundle" != "" ]]; then
            cp "$tests_bundle" "release-bundles/tests-${{ inputs.platform }}${{ inputs.debug-suffix }}.tar.gz"
          fi

          if [[ "$jdk_bundle_zip$jdk_bundle_tar_gz$symbols_bundle$tests_bundle" != "" ]]; then
            echo 'release-bundles-found=true' >> $GITHUB_OUTPUT
          else
            echo 'release-bundles-found=false' >> $GITHUB_OUTPUT
          fi
          tar cvf releases-bundles.tar ./release-bundles
        shell: bash

      - name: 'Release'
        uses: softprops/action-gh-release@v3
        id: tsrelease-linux-x64
        # The docs job also uses this workflow with platform linux-x64; don't
        # let it clobber the linux-x64 release with an empty tarball.
        if: steps.bundles.outputs.release-bundles-found == 'true'
        with:
          body: Build of OpenJDK 21.0.8 with Two Sigma's JGSS enhancements
          platform: ${{ inputs.platform }}
          debug-suffix: '${{ matrix.suffix }}'
          draft: false
          prerelease: false
          tag_name: ts-jgss-jdk21.0.8-2-linux-x64
          files: |
            releases-bundles.tar
          target_commitish: ts-jgss-jdk-21.0.8-ga
          generate_release_notes: false
          name: ts-jgss-jdk21.0.8-2-linux-x64

      - name: 'Upload bundles'
        uses: ./.github/actions/upload-bundles
        with:
          platform: ${{ inputs.platform }}
          debug-suffix: '${{ matrix.suffix }}'
